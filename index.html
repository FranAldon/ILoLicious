<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ILoLicious</title>
    <link rel="icon" type="image/png" href="images/LogosPic/TransparentLogo.png">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="hero">
    
    <div class="logo-text">
        <p style="Font-Family: Palatino">
            Welcome to ILoLicious! <br> where you will find
            different dishes<br> and cuisines around the <br> Seven Districts of Iloilo City
        </p>
    </div>

    </header>

    <nav class="district-nav">

        <button class="nav-button home-button"
            type="button" onclick="showHome()">
            Home
        </button>

        <button class="nav-button district-button"
            type="button" onclick="showDistrict(0)">
            La Paz
        </button>

        <button class="nav-button district-button"
            type="button" onclick="showDistrict(1)">
            Jaro
        </button>

        <button class="nav-button district-button"
            type="button" onclick="showDistrict(2)">
            Molo
        </button>

        <button class="nav-button district-button"
            type="button" onclick="showDistrict(3)">
            Arevalo (Villa)
        </button>

        <button class="nav-button district-button"
            type="button" onclick="showDistrict(4)">
            Mandurriao
        </button>

        <button class="nav-button district-button"
            type="button" onclick="showDistrict(5)">
            City Proper
        </button>

        <button class="nav-button district-button"
            type="button" onclick="showDistrict(6)">
            Lapuz
        </button>

    </nav>


    <main id="content"></main>


    <footer>
        <p>© 2026 ILoLicious | Discover the Taste of Iloilo</p>
    </footer>


    <script src="script.js"></script>

</body>
</html>

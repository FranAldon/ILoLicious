<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ILOlicious</title>
    <img src="images/TransparentLogo.png">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="hero">
    
    <div class="logo-container">
      <div class="logo-icon">
        <img src="images/logo.png" alt="ILOlicious Logo" width="100px">
      </div>

    <div class="logo-text">
        <p>
            Welcome to ILoLicious, where you will find
            different and unique cuisines in seven districts.
        </p>
    </div>

    </div>

    </header>

    <nav class="district-nav">

        <button class="nav-button home-button"
            type="button" onclick="showHome()">
            Home
        </button>

        <button class="nav-button district-button"
            type="button" onclick="showDistrict(0)">
            La Paz
        </button>

        <button class="nav-button district-button"
            type="button" onclick="showDistrict(1)">
            Jaro
        </button>

        <button class="nav-button district-button"
            type="button" onclick="showDistrict(2)">
            Molo
        </button>

        <button class="nav-button district-button"
            type="button" onclick="showDistrict(3)">
            Arevalo (Villa)
        </button>

        <button class="nav-button district-button"
            type="button" onclick="showDistrict(4)">
            Mandurriao
        </button>

        <button class="nav-button district-button"
            type="button" onclick="showDistrict(5)">
            City Proper
        </button>

        <button class="nav-button district-button"
            type="button" onclick="showDistrict(6)">
            Lapuz
        </button>

    </nav>


    <main id="content"></main>


    <footer>
        <p>© 2026 ILoLicious | Discover the Taste of Iloilo</p>
    </footer>


    <script src="script.js"></script>

</body>
</html>
